# Tokens to collect. Adding a token on an already supported protocol only needs an entry here.
#
# Common fields
#   symbol, protocol (adapter name), chain (key in chains.yaml), address, decimals
#   start_block      first block collected (deploy block, or later to skip legacy contract versions)
#   live_from_block  optional; rows before it are kept but flagged is_pre_launch
#   contracts        role -> contract or list of contracts {name, address, abi, from_block, price_sources, params}
#                    (roles are protocol-specific; address defaults to the token address; abi = file in abis/ w/o .json)
#   price_sources    ordered fallback list used to value each redemption at its block:
#                      rpc_call  - archive eth_call of a view (default Chainlink latestRoundData) at the event block;
#                                  timestamp_fn = optional second view for the update time (e.g. priceLastUpdated)
#                      http_nav  - daily NAV from an HTTP JSON API, as-of the event's UTC date
#                      constant  - fixed price
#                    if none can price an event, the earliest later price is used and the row is flagged price_is_backfilled

tokens:
  # ---------------------------------------------------------------- Superstate
  # Roles: token (OffchainRedeem, SetRedemptionContract), redemption (instant redemption contracts; params.token_out = payout asset)
  - symbol: USTB
    protocol: superstate
    chain: ethereum
    address: "0x43415eB6ff9DB7E26A15b704e7A3eDCe97d31C4e"
    decimals: 6
    start_block: 21932686  # token v4 (OffchainRedeem); legacy v1-v3 Burn events and redemption impl v1 not collected
    contracts:
      token: { abi: superstate/SuperstateToken }
      redemption:
        - name: redemption_idle
          address: "0x4c21b7577c8fe8b0b0669165ee7c8f67fa1454cf"
          abi: superstate/Redemption
          params: { token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }  # USDC
    price_sources:
      # Superstate continuous NAV/share oracle (Chainlink-compatible; linear extrapolation of the two newest NAV checkpoints).
      # Verified on-chain: the only oracle ever set on USTB (SetOracle at 21340716; re-set at 25574415 by the 1.2.0 storage
      # migration) and the immutable CHAINLINK_FEED_ADDRESS of every RedemptionIdle implementation, i.e. the exact
      # price instant redemptions pay out at. Deployed 21340412 (< start_block), so it covers the whole range.
      - type: rpc_call
        name: superstate_oracle_ustb
        address: "0xe4fa682f94610ccd170680cc3b045d77d9e528a8"
        decimals: 6
        from_block: 21340412
      # Fallbacks, only used if the oracle reverts at a block (it rejects prices > 5 days past the newest checkpoint):
      # Chainlink daily NAV feed, then the Superstate daily NAV API.
      - type: rpc_call
        name: chainlink_ustb_nav
        address: "0x289B5036cd942e619E1Ee48670F98d214E745AAC"
        decimals: 6
        from_block: 20181962
      - type: http_nav
        name: superstate_api_ustb
        url: "https://api.superstate.com/v1/funds/1/nav-daily"
        date_field: net_asset_value_date
        date_format: "%m/%d/%Y"
        price_field: net_asset_value

  - symbol: USCC
    protocol: superstate
    chain: ethereum
    address: "0x14d60e7fdc0d71d8611742720e4c50e7a974020c"
    decimals: 6
    start_block: 21932896  # token v4
    contracts:
      token: { abi: superstate/SuperstateToken }
    price_sources:
      # USCC has no continuous oracle (superstateOracle() == 0x0, no SetOracle events; docs list only Chainlink).
      # USCC is priced once per market day, so the daily Chainlink NAV feed is its native on-chain price.
      - type: rpc_call
        name: chainlink_uscc_nav
        address: "0xAfFd8F5578E8590665de561bdE9E7BAdb99300d9"
        decimals: 6
        from_block: 20930860
      - type: http_nav
        name: superstate_api_uscc
        url: "https://api.superstate.com/v1/funds/2/nav-daily"
        date_field: net_asset_value_date
        date_format: "%m/%d/%Y"
        price_field: net_asset_value

  # ---------------------------------------------------------------- Midas
  # Roles: vaults (redemption vaults; optional per-vault price_sources when a vault uses its own feed;
  #        optional params.liquidity_sources = external contracts the vault redeems at to fund an instant payout,
  #        each {address, abi, events}; matched in the receipt by emitter + topic0 + topic1 == vault → via_fallback)
  - symbol: mTBILL
    protocol: midas
    chain: ethereum
    address: "0xDD629E5241CbC5919847783e6C96B2De4754e438"
    decimals: 18
    # v2 vaults (first one deployed at this block). The token dates from 18691255; before the v2 vaults the only
    # redemptions were 8 admin burn() calls (18691432-20693403) without a redemption event, not collected.
    start_block: 20826541
    contracts:
      vaults:
        - name: main
          address: "0xF6e51d24F4793Ac5e71e0502213a9BBE3A6d4517"  # RedemptionVault (requests + instant from vault USDC)
          abi: midas/RedemptionVault
          from_block: 20826541
        - name: ustb
          # Proxy: RedemptionVaultWithBUIDL until the upgrade at 22674825, RedemptionVaultWithUSTB after it.
          # If the vault holds too little USDC, it redeems BUIDL (before) or USTB (after) for the missing amount.
          address: "0x569D7dccBF6923350521ecBC28A555A500c4f0Ec"
          abi: midas/RedemptionVault
          from_block: 20826724
          params:
            liquidity_sources:
              - address: "0x57dd4e92712b0fbc8d3f3e3645eebcf2600acef0"  # BUIDL USDC Settlement (via buidlRedemption 0x31d3...)
                abi: securitize/Settlement
                events: [SettlementCompleted]
              - address: "0x4c21b7577c8fe8b0b0669165ee7c8f67fa1454cf"  # Superstate USTB RedemptionIdle (ustbRedemption())
                abi: superstate/Redemption
                events: [Redeem, RedeemV2]
    price_sources:
      - type: rpc_call
        name: midas_mtbill_aggregator  # DataFeed 0xfCEE...4A2B -> aggregator(); the same aggregator at every block since deploy
        address: "0x056339C044055819E8Db84E71f5f2E1F536b2E5b"
        decimals: 8
        from_block: 20578232

  - symbol: mWIN
    protocol: midas
    chain: ethereum
    address: "0x4E72025984424E52838cf8953E2863eFf036B67A"
    decimals: 18
    start_block: 25236860
    live_from_block: 25637034  # aggregator was a ~$1 placeholder before; first real NAV ($130k) at this block
    contracts:
      vaults:
        - name: main
          address: "0x605704d7b36d1677a8d242ded68eD505523c7924"  # RedemptionVaultWithSwapper
          abi: midas/RedemptionVault
          from_block: 25237114
        - name: mtoken
          address: "0x14fECa41FB9541Fd8f61a6bA6304c5b706709fca"  # RedemptionVaultWithMToken
          abi: midas/RedemptionVault
          from_block: 25444095
        - name: dialectic
          address: "0x078b0858F609Beb26098379fB504763766b6f128"  # RedemptionVaultWithSwapper, own feed
          abi: midas/RedemptionVault
          from_block: 25732665
          price_sources:
            - type: rpc_call
              name: midas_mwin_dialectic_aggregator
              address: "0x17d3C24a956641983377975f0E903D4B87894E2B"
              decimals: 8
    price_sources:
      - type: rpc_call
        name: midas_mwin_aggregator  # aggregator, not DataFeed: DataFeed reverts when the feed is stale
        address: "0x1725A66D810C0775f6B3B0FD85646D371dA19517"
        decimals: 8

  # ---------------------------------------------------------------- Securitize
  # Roles: token (DSToken; params.redemption_wallet = the wallet holders transfer to for a request redemption),
  #        redemption (Redemption.sol instant contracts; settlements are discovered from SettlementUpdated;
  #                    params.token_out = payout asset), offramps (SecuritizeOffRamp instant contracts)
  - symbol: BUIDL
    protocol: securitize
    chain: ethereum
    address: "0x7712c34205737192402172409a8f7ccef8aa2aec"  # Securitize Proxy -> DSToken 0x603bb690...83b2
    decimals: 6
    start_block: 19343293  # token deploy
    contracts:
      token:
        abi: securitize/DSToken
        params: { redemption_wallet: "0x8780Dd016171B91E4Df47075dA0a947959C34200" }  # shared with BUIDL-I etc.
      redemption:
        - name: redemption_usdc  # legacy; its settlement 0x57dd... is paused since block 22439269
          address: "0x31D3F59Ad4aAC0eeE2247c65EBE8Bf6E9E470a53"
          abi: securitize/Redemption
          from_block: 19364633
          params: { token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }  # USDC
        - name: redemption_usdtb
          address: "0x4580D3c5fFF079BDe60Af9e98B62d4FB031eE0a0"
          abi: securitize/Redemption
          from_block: 22442051
          params: { token_out: "0xc139190f447e929f090edeb554d95abb8b18ac1c" }  # USDtb
      offramps:
        - name: offramp_rlusd
          address: "0x04FB23ef3cb3eB559D0ba096FbFda90241fF8e66"  # SecuritizeOffRamp (ERC1967 proxy)
          abi: securitize/SecuritizeOffRamp
          from_block: 23233078
        - name: offramp_usdc_elp  # ExternalLiquidityProviderOffRamp; not in Securitize's public feed
          address: "0x6a1705b528c35d479f45418ef77007b28e02b09f"
          abi: securitize/SecuritizeOffRamp
          from_block: 25574754
    price_sources:
      # BUIDL is a $1.00 stable-NAV fund; every instant path pays out 1:1 (RedStone NAV feed has always read 1.00)
      - type: constant
        name: buidl_usd_1
        value: 1.0

  # ---------------------------------------------------------------- Ondo
  # Roles: instant_managers  params.kind: xmanager (default; `Redemption`, + params.rebasing_event for rUSDY/rOUSG)
  #                                       | ousg_legacy (InstantRedemptionOUSG / ...RebasingOUSG; params.token_out)
  #        request_managers  params.kind: rwa_hub (default; RedemptionRequestedServicedOffChain / RedemptionRequested)
  #                                       | cash_manager (RedemptionRequested(user, cashAmountIn, epoch))
  #                          params.token_out = collateral paid for on-chain-claimed requests
  #        token             params.redemption_wallet = Ondo's documented wallet for manual redemptions
  #                          (rows: Transfer to it, filtered on the indexed `to`; mints dropped)
  # params.not_collected on any contract = a known gap, repeated in the manifest checks.
  #
  # USDY
  # Request rows are INCOMPLETE: holders also send USDY to Ondo-controlled Safes (e.g. 0x505ff446…, 0x1a694a09…) that
  # burn it in batches. Ondo does not document that path, so it is not collected (docs/notes/usdy-redemptions.md).
  # Bridge burns (LayerZero OFT adapter, Axelar SourceBridge) are not redemptions and are not collected.
  - symbol: USDY
    protocol: ondo
    chain: ethereum
    address: "0x96F6eF951840721AdBF46Ac996b59E0235CB985C"
    decimals: 18
    start_block: 17672244  # token deploy
    contracts:
      instant_managers:
        - name: instant_manager
          address: "0xa42613C243b67BF6194Ac327795b926B4b491f15"  # USDY_InstantManager (with rUSDY redeem)
          abi: ondo/USDY_InstantManager
          from_block: 23970980
          params:
            rebasing_event: InstantRedemptionRebasingUSDY
            rebasing_amount_field: usdyAmountIn
            rebasing_wrapper_field: rusdyAmountIn
      request_managers:
        - name: usdy_manager  # legacy (Ondo docs: deprecated); last request at 24828144
          address: "0x25A103A1D6AeC5967c1A4fe2039cdc514886b97e"
          abi: ondo/USDYManager
          params:
            not_collected: "USDY transfers to Ondo-controlled Safes that are later burned (undocumented path); request rows are incomplete"
          from_block: 17721123
    price_sources:
      # USDYOracleWrapper: points to the canonical USDY oracle (ContinuousPriceOracle since 2026-11-01). Same value as
      # OndoOracle.getAssetPrice(USDY), the price the instant manager pays at.
      - type: rpc_call
        name: usdy_oracle_wrapper
        address: "0x87b126e5518b6a1Bb8465779b4607C45C643DF90"
        abi: ondo/USDYOracle
        fn: getPrice
        decimals: 18
        from_block: 23949241
      # Before the wrapper: RWADynamicOracle (daily rate, used by rUSDY); equal to the wrapper until 2026-11-01
      - type: rpc_call
        name: usdy_rwa_dynamic_oracle
        address: "0xa0219aa5b31e65bc920b5b6dfb8edf0988121de0"
        abi: ondo/USDYOracle
        fn: getPrice
        decimals: 18
        from_block: 18485028
      # Before RWADynamicOracle (1 request at 18263212): USDYManager's pricer, latest set price
      - type: rpc_call
        name: usdy_pricer
        address: "0x7fb0228c6338da4ec948df7b6a8e22ad2bb2bfb5"
        abi: ondo/USDYPricer
        fn: getLatestPrice
        decimals: 18
        from_block: 17672215

  # OUSG. Burn reconciliation: every OUSG burn is a manager redemption, a redemption-wallet burn, or dust
  # (docs/notes/ousg-redemptions.md). Two managers (first OUSGInstantManager 0x1189…, original CashManager 0x70b4…)
  # are not in Ondo's address list but are verified Ondo contracts with the same events.
  - symbol: OUSG
    protocol: ondo
    chain: ethereum
    address: "0x1B19C19393e2d034D8Ff31ff34c81252FcBbee92"
    decimals: 18
    start_block: 16234210  # token deploy
    contracts:
      instant_managers:
        - name: instant_manager
          address: "0x93358db73B6cd4b98D89c8F5f230E81a95c2643a"  # OUSG_InstantManager (xManager, with rOUSG redeem)
          abi: ondo/OUSG_InstantManager
          from_block: 22141423
          params:
            rebasing_event: InstantRedemptionRebasingOUSG
            rebasing_amount_field: ousgAmountIn
            rebasing_wrapper_field: rousgAmountIn
        - name: instant_manager_legacy  # Ondo docs: deprecated 2025-04-07
          address: "0x2826989983e3a66F0622132D019c2Ae173eb6A43"
          abi: ondo/OUSGInstantManager
          from_block: 19719494
          params: { kind: ousg_legacy, token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }  # usdc()
        - name: instant_manager_v0  # first OUSGInstantManager (undocumented; same deployer and events as legacy)
          address: "0x1189bacb100676db9a495eec04a730a53a8ad97c"
          abi: ondo/OUSGInstantManager
          from_block: 19670956
          params: { kind: ousg_legacy, token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }
      request_managers:
        - name: ousg_manager  # RWAHub; Ondo docs: deprecated 2024-04-15
          address: "0xF16c188c2D411627d39655A60409eC6707D3d5e8"
          abi: ondo/OUSGManager
          from_block: 18742790
          params: { token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }  # collateral()
        - name: cash_manager  # Ondo docs: deprecated 2023-12-13
          address: "0x3501883a646f1F8417BcB62162372550954D618f"
          abi: ondo/CashManager
          from_block: 16677854
          params: { kind: cash_manager, token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }
        - name: cash_manager_v0  # original CashManager (undocumented), 1 request
          address: "0x70b45a68ca257db49dec455af6c725f7f1c904e8"
          abi: ondo/CashManager
          from_block: 16234235
          params: { kind: cash_manager, token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }
      token:
        abi: ondo/OUSG
        params:
          redemption_wallet: "0x72Be8C14B7564f7a61ba2f6B7E50D18DC1D4B63D"  # "OUSG Recipient ... for manual redemptions"
          not_collected: "Transfers to the OUSG admin Safe 0xaed4caf2… (likely the manual-redemption wallet before 0x72be…, undocumented)"
    price_sources:
      # RWAOracleExternalComparisonCheck: the OUSG oracle behind OUSGOracleWrapper / OndoOracle and the legacy
      # instant managers (getOUSGPrice). Updated daily; first price at 17131761.
      - type: rpc_call
        name: ousg_rwa_oracle
        address: "0x0502c5ae08E7CD64fe1AEDA7D6e229413eCC6abe"
        abi: ondo/OUSGOracle
        fn: rwaPrice
        decimals: 18
        from_block: 17131761
      # Before that: CashManager's last set mint exchange rate (real rates from 16735625; agrees with the oracles)
      - type: rpc_call
        name: ousg_cash_manager_rate
        address: "0x3501883a646f1F8417BcB62162372550954D618f"
        abi: ondo/CashManager
        fn: lastSetMintExchangeRate
        decimals: 18
        from_block: 16735625

  # ---------------------------------------------------------------- Centrifuge
  # Roles: vaults  ERC-7540 vaults of the share token (one per payout asset and protocol version);
  #                params.token_out = vault asset(); price_sources = that vault's pricePerShare()
  #        token   share token; its VaultUpdate events list every vault ever linked (unlinked-but-unconfigured
  #                vaults are reported in checks.unconfigured_vaults)
  # Redemption is always async (requestRedeem -> hub epoch -> claim with withdraw/redeem); there is no instant path.
  #
  # JAAA: Janus Henderson Anemoy AAA CLO Fund. Pool 281474976710663, share class 0x00010000000000070000000000000001.
  # The share token is the Centrifuge v2 Tranche contract, reused by v3. Not collected (docs/notes/jaaa-redemptions.md):
  # manual BalanceSheet revokes by a pool manager (no vault event) and crosschain share transfers (not redemptions).
  - symbol: JAAA
    protocol: centrifuge
    chain: ethereum
    address: "0x5a0F93D040De44e78F251b03c43be9CF317Dcf64"
    decimals: 6
    start_block: 22297839  # token deploy
    contracts:
      token:
        abi: centrifuge/ShareToken
        params:
          not_collected: "Manual BalanceSheet revokes: a pool manager pulls a holder's JAAA and burns it without a vault event (6 so far, 160.7M JAAA); likely off-chain-settled redemptions, undocumented"
      vaults:
        - name: usdc_v2  # Centrifuge v2 ERC7540Vault; linked 22297843-22982600 and 23015872-23382941
          address: "0xE9d1f733F406D4bbbDFac6D4CfCD2e13A6ee1d01"
          abi: centrifuge/AsyncVault
          from_block: 22297843
          params: { token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }  # USDC
          price_sources:
            - type: rpc_call
              name: jaaa_usdc_v2_vault_price_per_share
              address: "0xE9d1f733F406D4bbbDFac6D4CfCD2e13A6ee1d01"
              abi: centrifuge/AsyncVault
              fn: pricePerShare
              timestamp_fn: priceLastUpdated
              decimals: 6
        - name: usdc  # v3 AsyncVault; the same address for v3.0 and v3.1 (manager re-filed at 24376326)
          address: "0x4880799eE5200fC58DA299e965df644fBf46780B"
          abi: centrifuge/AsyncVault
          from_block: 22982600
          params: { token_out: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }  # USDC
        - name: usdt
          address: "0x4a76FB02421b1D38AaA40dB541F59B2CB04b0770"
          abi: centrifuge/AsyncVault
          from_block: 25350680
          params: { token_out: "0xdac17f958d2ee523a2206206994597c13d831ec7" }  # USDT
          price_sources:
            - type: rpc_call
              name: jaaa_usdt_vault_price_per_share
              address: "0x4a76FB02421b1D38AaA40dB541F59B2CB04b0770"
              abi: centrifuge/AsyncVault
              fn: pricePerShare
              timestamp_fn: priceLastUpdated
              decimals: 6
        - name: ausd
          address: "0x3148910f61C761A8Ea939c5d6ab88e5265b71106"
          abi: centrifuge/AsyncVault
          from_block: 25351412
          params: { token_out: "0x00000000efe302beaa2b3e6e1b18d08d69a9012a" }  # AUSD
          price_sources:
            - type: rpc_call
              name: jaaa_ausd_vault_price_per_share
              address: "0x3148910f61C761A8Ea939c5d6ab88e5265b71106"
              abi: centrifuge/AsyncVault
              fn: pricePerShare
              timestamp_fn: priceLastUpdated
              decimals: 6
        - name: usat
          address: "0x13470dbaaafddbf1a0d9048ddcafd6dd82e14372"
          abi: centrifuge/AsyncVault
          from_block: 25839861
          params: { token_out: "0x07041776f5007aca2a54844f50503a18a72a8b68" }  # USAT
          price_sources:
            - type: rpc_call
              name: jaaa_usat_vault_price_per_share
              address: "0x13470dbaaafddbf1a0d9048ddcafd6dd82e14372"
              abi: centrifuge/AsyncVault
              fn: pricePerShare
              timestamp_fn: priceLastUpdated
              decimals: 6
    price_sources:
      # Default (the usdc vault): vault.pricePerShare() = convertToAssets(1 share) in USDC (6 dp), from the last share
      # and asset prices pushed by the hub; read at the event block (archive eth_call). Valued as USD: every vault
      # asset is a USD stablecoin with a fixed 1.0 price in chains.yaml.
      - type: rpc_call
        name: jaaa_usdc_vault_price_per_share
        address: "0x4880799eE5200fC58DA299e965df644fBf46780B"
        abi: centrifuge/AsyncVault
        fn: pricePerShare
        timestamp_fn: priceLastUpdated
        decimals: 6
